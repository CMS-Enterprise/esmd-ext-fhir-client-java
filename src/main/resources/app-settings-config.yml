      - name: "transaction-status-type"
        value: "ready-to-download"
        inject: false
      - name: "requesttype"
        value: "ADMIN_ERROR"
        inject: false
      - name: "uniqueid"
        value: ""
        inject: false

  documentRetrievalAPI:
    endpointURL: "${endPointBaseUrl}/api/esmdf/v1/fhir/DocumentReference"
