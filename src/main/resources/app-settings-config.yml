            display: "very restricted"
      type: "transaction"
      timestamp: ""
      entry: []

  notificationRetrievalAPI:
    endpointURL: "${endPointBaseUrl}/api/esmdf/v1/fhir/List"
    accept: "application/fhir+json"
    httpClientRequestTimeOutSeconds: 4.0
